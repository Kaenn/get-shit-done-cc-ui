name: Build Web Binaries

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win32-x64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --locked --bin gsd-ui-web"
          strip: true

      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          BINARY="target/${{ matrix.target }}/release/gsd-ui-web"
          ARTIFACT="gsd-ui-web-${{ matrix.name }}"
          cp "$BINARY" "dist/$ARTIFACT"
          cd dist
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $binary = "target/${{ matrix.target }}/release/gsd-ui-web.exe"
          $artifact = "gsd-ui-web-${{ matrix.name }}.exe"
          Copy-Item $binary "dist/$artifact"
          cd dist
          $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLower()
          "$hash  $artifact" | Out-File -Encoding utf8 "$artifact.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          retention-days: 7
